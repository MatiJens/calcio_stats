{% extends "base.html" %}
{% block title %}Table — Serie A Stats{% endblock %}
{% block content %}
<h1>League table</h1>
<table>
    <thead>
        <tr>
            <th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>Pts</th>
        </tr>
    </thead>
    <tbody>
        {% for row in standings %}
        <tr>
            <td>{{ row.position }}</td>
            <td>{{ row.team }}</td>
            <td>{{ row.playedGames }}</td>
            <td>{{ row.won }}</td>
            <td>{{ row.draw }}</td>
            <td>{{ row.lost }}</td>
            <td>{{ row.points }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
